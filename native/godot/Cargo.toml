[package]
name = "wargrid_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wargrid_core = { path = "../core", default-features = false }
godot = { version = "=0.5.5", default-features = false, features = ["api-4-7"] }

[features]
default = ["horde", "movement", "probe"]
horde = ["wargrid_core/horde"]
movement = ["wargrid_core/movement"]
probe = []
